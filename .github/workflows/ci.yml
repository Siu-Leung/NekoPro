name: CI

on:
  push:
    branches: [main, 'feat/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish GitHub Release'
        required: false
        default: false
        type: boolean
      tag_name:
        description: 'Release Tag Name (e.g. v1.1.0)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') && github.ref != 'refs/heads/main' }}

jobs:
  go-tests:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26.7'
          cache-dependency-path: |
            mihomo/go.sum
            sing-box/go.sum
            NekoBox/libcore/go.sum
      - name: Test libneko
        working-directory: libneko
        run: go test -race ./...
      - name: Test mihomo XHTTP and outbound (Mieru MTU)
        working-directory: mihomo
        run: go test ./transport/xhttp/... ./adapter/outbound
      - name: Test sing-box
        working-directory: sing-box
        shell: bash
        run: |
          tags='with_conntrack,with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,no_tailscale'
          listed_packages=$(go list -tags="$tags" ./...)
          packages=()
          while IFS= read -r pkg; do
            if [[ -n "$pkg" && "$pkg" != */common/netns ]]; then
              packages+=("$pkg")
            fi
          done <<< "$listed_packages"
          test "${#packages[@]}" -gt 0
          go test -ldflags='-checklinkname=0' -tags="$tags" "${packages[@]}"
      - name: Test libcore
        working-directory: NekoBox/libcore
        run: go test -tags='with_conntrack,with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,no_tailscale' ./...

  android-build:
    name: Android build
    needs: go-tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26.7'
          cache-dependency-path: NekoBox/libcore/go.sum
      - name: Install Android NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'ndk;25.0.8775105'
      - name: Build libcore
        working-directory: NekoBox/libcore
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/25.0.8775105
          NDK: ${{ env.ANDROID_HOME }}/ndk/25.0.8775105
        run: |
          bash ./init.sh
          bash ./build.sh
      - name: Restore release keystore
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_B64"
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/nekopro-release.keystore"
          chmod 600 "$RUNNER_TEMP/nekopro-release.keystore"
      - name: Test, lint, and build signed APKs
        working-directory: NekoBox
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/nekopro-release.keystore
          KEYSTORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.RELEASE_KEY_ALIAS }}
          ALIAS_PASS: ${{ secrets.RELEASE_KEY_PASS }}
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          bash ./gradlew :app:testOssReleaseUnitTest :app:lintVitalOssRelease assembleOssRelease --no-daemon
      - name: Verify APK signatures and generate checksums
        working-directory: NekoBox/app/build/outputs/apk/oss/release
        shell: bash
        run: |
          # Public signer fingerprint verified from the approved v1.2.2 arm64-v8a APK.
          expected_cert_sha256='cc5b759e7e8fe92a23d218d86629d430859d87f14a98a9bbc15e4d39baf5f37c'
          apksigner="$(printf '%s\n' "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner"
          shopt -s nullglob
          apks=(./*.apk)
          test "${#apks[@]}" -eq 4
          for apk in "${apks[@]}"; do
            certs=$("$apksigner" verify --print-certs "$apk")
            cert_sha256=$(awk '/^Signer #[0-9]+ certificate SHA-256 digest: / {print $NF}' <<< "$certs")
            if [[ "$cert_sha256" != "$expected_cert_sha256" ]]; then
              echo "Unexpected signing certificate for $apk (expected the v1.2.2 signer)." >&2
              exit 1
            fi
          done
          mkdir -p checksums
          md5sum "${apks[@]}" > checksums/MD5SUMS.txt
          sha256sum "${apks[@]}" > checksums/SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NekoPro-signed-apks
          path: |
            NekoBox/app/build/outputs/apk/oss/release/*.apk
            NekoBox/app/build/outputs/apk/oss/release/checksums/*.txt
          if-no-files-found: error
      - name: Prepare v1.2.2 upgrade baseline
        if: startsWith(github.ref, 'refs/heads/feat/') || github.ref == 'refs/heads/main' || github.ref == 'refs/tags/v1.3.0'
        run: |
          curl --fail --location --retry 3 --max-time 90 -o "$RUNNER_TEMP/nekopro-v1.2.2-x86_64.apk" \
            'https://github.com/Siu-Leung/NekoPro/releases/download/v1.2.2/NekoBox-Neko-Pro-1.2.2-x86_64.apk'
          printf '%s  %s\n' 'c4c1a02a19ce248e21bd2670e8ef00974be306e69bb7fe9252b65e9a4e6fd4f9' "$RUNNER_TEMP/nekopro-v1.2.2-x86_64.apk" | sha256sum --check
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Verify signed v1.2.2 upgrade preserves saved profile
        if: startsWith(github.ref, 'refs/heads/feat/') || github.ref == 'refs/heads/main' || github.ref == 'refs/tags/v1.3.0'
        uses: ReactiveCircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-linux-hw-accel: false
          script: bash .github/scripts/check-android-upgrade.sh "$RUNNER_TEMP/nekopro-v1.2.2-x86_64.apk" NekoBox/app/build/outputs/apk/oss/release/NekoBox-Neko-Pro-1.3.0-x86_64.apk
      - name: Resolve release metadata
        id: release_meta
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_STR: ${{ github.ref }}
          GITHUB_REF_NAME_STR: ${{ github.ref_name }}
          INPUT_PUBLISH: ${{ inputs.publish_release }}
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          should_release="false"
          tag_name=""

          derive_tag_from_props() {
            local raw ver
            raw="$(grep -E '^VERSION_NAME=' NekoBox/nb4a.properties | head -n1 | cut -d= -f2- | tr -d '\r\n ')"
            ver="$(printf '%s' "$raw" | sed -nE 's/.*([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?).*/\1/p')"
            if [ -n "$ver" ]; then
              printf 'v%s' "$ver"
            fi
          }

          if [[ "$GITHUB_REF_STR" == refs/tags/v* ]]; then
            should_release="true"
            tag_name="$GITHUB_REF_NAME_STR"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$INPUT_PUBLISH" == "true" ]]; then
            should_release="true"
            tag_name="${INPUT_TAG:-$(derive_tag_from_props)}"
          elif [[ "$EVENT_NAME" == "push" && "$GITHUB_REF_STR" == "refs/heads/main" ]]; then
            candidate_tag="$(derive_tag_from_props)"
            if [ -n "$candidate_tag" ]; then
              tag_exists="$(git ls-remote --tags origin "refs/tags/${candidate_tag}")"
              if [ -z "$tag_exists" ] && ! gh release view "$candidate_tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                should_release="true"
                tag_name="$candidate_tag"
              else
                echo "Release tag ${candidate_tag} already exists; skipping auto-release."
              fi
            fi
          fi

          has_notes="false"
          notes_path="${RUNNER_TEMP}/release-notes.md"
          if [[ "$should_release" == "true" && -n "$tag_name" ]]; then
            python3 - "$tag_name" "$notes_path" <<'PY'
          import re
          import sys
          from pathlib import Path

          tag = sys.argv[1]
          out_path = Path(sys.argv[2])
          readme = Path("README.md").read_text(encoding="utf-8").splitlines()

          heading_re = re.compile(rf"^###\s+{re.escape(tag)}\b")
          start = None
          for idx, line in enumerate(readme):
              if heading_re.match(line):
                  start = idx + 1
                  break

          if start is not None:
              body_lines = []
              for line in readme[start:]:
                  if line.startswith("## ") or line.startswith("### "):
                      break
                  body_lines.append(line)
              body = "\n".join(body_lines).strip()
              if body:
                  out_path.write_text(f"## Neko Pro {tag} 更新说明\n\n{body}\n", encoding="utf-8")
          PY
            if [ -s "$notes_path" ]; then
              has_notes="true"
            fi
          fi

          {
            echo "should_release=${should_release}"
            echo "tag_name=${tag_name}"
            echo "has_notes=${has_notes}"
            echo "body_path=${notes_path}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved release metadata: should_release=${should_release} tag_name=${tag_name} has_notes=${has_notes}"
      - name: Publish GitHub Release
        if: steps.release_meta.outputs.should_release == 'true' && steps.release_meta.outputs.tag_name != ''
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: Neko Pro ${{ steps.release_meta.outputs.tag_name }}
          body_path: ${{ steps.release_meta.outputs.has_notes == 'true' && steps.release_meta.outputs.body_path || '' }}
          generate_release_notes: ${{ steps.release_meta.outputs.has_notes != 'true' }}
          make_latest: true
          files: |
            NekoBox/app/build/outputs/apk/oss/release/*.apk
            NekoBox/app/build/outputs/apk/oss/release/checksums/*.txt
          draft: false
          prerelease: false
