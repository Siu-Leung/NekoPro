name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish GitHub Release'
        required: false
        default: false
        type: boolean
      tag_name:
        description: 'Release Tag Name (e.g. v1.1.0)'
        required: false
        default: 'v1.1.0'

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-tests:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
          cache-dependency-path: |
            sing-box/go.sum
            NekoBox/libcore/go.sum
      - name: Test sing-box
        working-directory: sing-box
        run: go test ./...
      - name: Test libcore
        working-directory: NekoBox/libcore
        run: go test ./...

  android-build:
    name: Android build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
          cache-dependency-path: NekoBox/libcore/go.sum
      - name: Install Android NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'ndk;25.0.8775105'
      - name: Build libcore
        working-directory: NekoBox/libcore
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/25.0.8775105
          NDK: ${{ env.ANDROID_HOME }}/ndk/25.0.8775105
        run: |
          bash ./init.sh
          bash ./build.sh
      - name: Restore release keystore
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_B64"
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/nekopro-release.keystore"
          chmod 600 "$RUNNER_TEMP/nekopro-release.keystore"
      - name: Test and build signed APKs
        working-directory: NekoBox
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/nekopro-release.keystore
          KEYSTORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.RELEASE_KEY_ALIAS }}
          ALIAS_PASS: ${{ secrets.RELEASE_KEY_PASS }}
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          bash ./gradlew :app:testOssReleaseUnitTest assembleOssRelease --no-daemon
          mkdir -p app/build/outputs/apk/oss/release/checksums
          cd app/build/outputs/apk/oss/release
          test "$(find . -maxdepth 1 -name '*.apk' | wc -l)" -eq 4
          for apk in ./*.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          done
          md5sum ./*.apk > checksums/MD5SUMS.txt
          sha256sum ./*.apk > checksums/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NekoPro-signed-apks
          path: |
            NekoBox/app/build/outputs/apk/oss/release/*.apk
            NekoBox/app/build/outputs/apk/oss/release/checksums/*.txt
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: Neko Pro ${{ inputs.tag_name || github.ref_name }}
          files: |
            NekoBox/app/build/outputs/apk/oss/release/*.apk
            NekoBox/app/build/outputs/apk/oss/release/checksums/*.txt
          draft: false
          prerelease: false
