name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-tests:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
          cache-dependency-path: |
            sing-box/go.sum
            NekoBox/libcore/go.sum
      - name: Test sing-box
        working-directory: sing-box
        run: go test ./...
      - name: Test libcore
        working-directory: NekoBox/libcore
        run: go test ./...

  android-build:
    name: Android build (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
          cache-dependency-path: NekoBox/libcore/go.sum
      - name: Install Android NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'ndk;25.0.8775105'
      - name: Build libcore
        working-directory: NekoBox/libcore
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/25.0.8775105
          NDK: ${{ env.ANDROID_HOME }}/ndk/25.0.8775105
        run: |
          bash ./init.sh
          bash ./build.sh
      - name: Test and build unsigned APK
        working-directory: NekoBox
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          bash ./gradlew :app:testOssReleaseUnitTest assembleOssRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: NekoPro-unsigned-apks
          path: NekoBox/app/build/outputs/apk/oss/release/*.apk
          if-no-files-found: error